# ═══════════════════════════════════════════════════════════════════════════════
#  설정 지도 (어디에 뭐가 있나) - 헷갈리면 여기만 보면 됨
#   • 비밀 아닌 모든 설정      = 이 파일(application.yml). 실값/기본값이 여기 다 있고 커밋된다.
#   • 진짜 크리덴셜(키·비번·토큰) = application-secret.yml (gitignored, 값만). 아래 `${ENV:}` 는 빈 바인딩 선언.
#   • 운영에서만 다른 값(origins·base-url 등) = 배포 시 deploy.sh 가 env 로 주입.
#   자세히: docs/ENV.md
# ═══════════════════════════════════════════════════════════════════════════════
spring:
  application:
    name: aixnative

  # 기본 활성 프로필 = secret,h2.
  #  - secret : 크리덴셜 단일 소스 `application-secret.yml`(gitignored) 로드. 파일 없으면 조용히 무시.
  #  - h2     : 파일 DB(무설치 부팅).
  # 테스트는 @ActiveProfiles("test") 가 이 기본을 대체(=secret 미로드), 운영은 SPRING_PROFILES_ACTIVE=postgres 로 대체.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:secret,h2}

  # dev default = PostgreSQL. Override via env (DB_URL/DB_USER/DB_PASSWORD).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aixnative}
    username: ${DB_USER:aixnative}
    password: ${DB_PASSWORD:}  # 🔑 값 → application-secret.yml

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (single source of truth). Hibernate never alters it.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Email (가입 인증/알림/뉴스레터) ---
  # 실제 host/username/password 값은 application-secret.yml(gitignored, 이미지에 구워짐, secret 프로필)에 있음.
  # 여기 ${MAIL_*:} 는 빈 기본값 선언 겸 env 오버라이드 훅. 값 없으면(test 프로필 등) JavaMailSender
  # 빈 미생성 → EmailService 가 graceful 로그 폴백(발송 안 함). 아래 smtp 속성은 비-시크릿이라 커밋.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true   # Gmail 587 = STARTTLS 필수
            required: true
        transport:
          protocol: smtp

  # --- 소셜 로그인 (구글/카카오) - 신규 client-id/secret 확보 후 연결. Phase 1 범위 밖. ---
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID:}
  #           client-secret: ${GOOGLE_CLIENT_SECRET:}  # 🔑 값 → application-secret.yml
  #         kakao:
  #           client-id: ${KAKAO_CLIENT_ID:}
  #           client-secret: ${KAKAO_CLIENT_SECRET:}  # 🔑 값 → application-secret.yml

# Stateless JWT signing. SECRET must be >= 32 bytes (HS256). Override in prod.
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-32bytes-minimum-secret-0123}  # 🔑 값 → application-secret.yml
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:120}

# AI router (priority + fallback). New keys only - never copy legacy values.
ai:
  service:
    auto-fallback: ${AI_AUTO_FALLBACK:true}
    provider-timeout-ms: ${AI_PROVIDER_TIMEOUT_MS:75000}
    overall-deadline-ms: ${AI_OVERALL_DEADLINE_MS:90000}

claude:
  api:
    key: ${CLAUDE_API_KEY:}  # 🔑 값 → application-secret.yml
    url: ${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
    model: ${CLAUDE_API_MODEL:claude-opus-4-8}
    # 종합 분석(IC메모·시장조사 등)이 잘리지 않도록 8192. provider-timeout 75s 내 완주 가능.
    max-tokens: ${CLAUDE_MAX_TOKENS:8192}
  # 구독 OAuth 토큰(sk-ant-oat...). 설정 시 Bearer 인증 사용(x-api-key 대신).
  oauth:
    token: ${CLAUDE_OAUTH_TOKEN:}  # 🔑 값 → application-secret.yml
  priority: ${CLAUDE_PRIORITY:0}

# 무료 AI(Mistral) - 신규 키만(env). 스케줄 배치 수집 보강(마켓 브리핑)에 직접 사용 → Claude 과금 격리.
# 미설정 시 브리핑은 자동 생략(딜 카드 수집은 그대로). priority 가 Claude(0)보다 높아 일반 라우터는 Claude 우선.
mistral:
  api:
    key: ${MISTRAL_API_KEY:}  # 🔑 값 → application-secret.yml
    url: ${MISTRAL_API_URL:https://api.mistral.ai/v1/chat/completions}
    model: ${MISTRAL_API_MODEL:mistral-small-latest}
    max-tokens: ${MISTRAL_MAX_TOKENS:4096}
  priority: ${MISTRAL_PRIORITY:5}

# Pollinations 무료 AI 이미지 생성(키 불필요·건당 0원) - 공감랭킹 스토리 장면 배경 생성의 기본 경로.
# Gemini 이미지는 API 무료 할당량이 0(빌링 필요)이라, 진짜 무료 생성형은 이쪽. 실패 시 스톡→타이포로 장면별 폴백.
pollinations:
  enabled: ${POLLINATIONS_ENABLED:true}
  url: ${POLLINATIONS_URL:https://image.pollinations.ai/prompt}
  model: ${POLLINATIONS_MODEL:flux}

# Gemini 이미지 생성(Nano Banana) - 신규 키만(env). ⚠️ API 무료 할당량 0(2026-07 확인) → 빌링(유료, 장당 ~$0.04) 켜야 동작.
# 무료로 쓰려면 pollinations 사용(위). 키 설정 + 빌링 시 Pollinations 다음 우선순위로 사용됨.
gemini:
  api:
    key: ${GEMINI_API_KEY:}  # 🔑 값 → application-secret.yml
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}

# Pexels 무료 스톡사진 - 신규 키만(env). Gemini 그림 대안(무료·건당 0원). 장면 키워드로 실사진 검색.
# 미설정 시 편집형 타이포 폴백. Gemini 가 설정돼 있으면 그쪽 우선(Order). 키는 pexels.com/api 무료 발급.
pexels:
  api:
    key: ${PEXELS_API_KEY:}  # 🔑 값 → application-secret.yml
    url: ${PEXELS_API_URL:https://api.pexels.com/v1}

# Pixabay 무료 스톡사진 - Pexels 와 동일 역할(무료 대안). 발급이 쉬워 우선 사용. 키는 계정 페이지에 노출.
# Order: Gemini(그림) > Pixabay > Pexels > 편집형 타이포 폴백.
pixabay:
  api:
    key: ${PIXABAY_API_KEY:}  # 🔑 값 → application-secret.yml
    url: ${PIXABAY_API_URL:https://pixabay.com/api}

# 스크래핑 프록시(ScraperAPI 등) - 커뮤니티가 Cloud Run 데이터센터 IP 를 차단(430/403/빈페이지)해서
# 주거용 IP 경유가 필요. 키 미설정 시 직접 fetch(로컬/비차단 환경용) - graceful. 무료 티어 월 ~1000건.
# render/premium 은 크레딧 배수 소모 → 기본 off(대상 대부분 서버렌더라 IP 우회만으로 충분).
scraping:
  api:
    key: ${SCRAPINGAPI_KEY:}  # 🔑 값 → application-secret.yml (scraperapi.com 무료 발급)
    url: ${SCRAPINGAPI_URL:https://api.scraperapi.com}
    render-js: ${SCRAPINGAPI_RENDER:false}
    premium: ${SCRAPINGAPI_PREMIUM:false}
    country-code: ${SCRAPINGAPI_COUNTRY:}

# 시장 인텔리전스 자동 수집. 수집(RSS·구글뉴스)은 키 0개로 동작, 브리핑만 무료 Mistral 필요(graceful).
# 트리거: Cloud Scheduler → POST /api/ingest/market-feed (헤더 X-Ingest-Token). 토큰 미설정 시 인입 비활성.
marketfeed:
  ingest-token: ${MARKETFEED_INGEST_TOKEN:}  # 🔑 값 → application-secret.yml
  recent-hours: ${MARKETFEED_RECENT_HOURS:72}
  max-per-source: ${MARKETFEED_MAX_PER_SOURCE:15}
  max-cards: ${MARKETFEED_MAX_CARDS:90}
  google-news-enabled: ${MARKETFEED_GOOGLE_NEWS:true}
  briefing-enabled: ${MARKETFEED_BRIEFING:true}

# 공감랭킹 소셜 자동게시. 소재 수집(구글뉴스 RSS)은 키 0개, 캡션은 Claude(운영 계정) 사용.
# 트리거: Cloud Scheduler → POST /api/ingest/social-post (헤더 X-Ingest-Token, 마켓피드와 동일 방식).
# 인스타 게시는 access-token/business-account-id 설정 시에만 활성(graceful) - 미설정 시 승인까지만.
social:
  ingest-token: ${SOCIAL_INGEST_TOKEN:}  # 🔑 값 → application-secret.yml (마켓피드 토큰과 별개 가능)
  rank-size: ${SOCIAL_RANK_SIZE:5}
  recent-hours: ${SOCIAL_RECENT_HOURS:168}
  # 유튜브 Data API v3 키. 빈 값이면 유튜브 인기영상 소스만 graceful 비활성(다른 소스는 정상).
  youtube-api-key: ${YOUTUBE_API_KEY:}  # 🔑 GCP 콘솔 aixnative 프로젝트에서 신규 발급
  # 유튜브 카테고리·언론사 RSS·커뮤니티 대상 기본값은 SocialProperties 코드에 정의(필요 시 오버라이드).
  # 스토리 모드 커뮤니티 핫글 대상(인기/베스트 게시판 목록 페이지). 각 핫글 1건 = 스토리 게시물 1건.
  # 정적 스크랩이라 봇차단/JS 렌더 사이트는 graceful 빈결과. 항상 리스크 HIGH(관리자 승인 단계 판단).
  # 프록시(scraping.api.key) 설정 시 주거IP 경유로 접근. 미설정이면 대부분 Cloud Run IP 차단으로 빈결과.
  community-story-targets:
    - label: "에펨코리아 포텐"
      url: "https://www.fmkorea.com/best"
    - label: "디시인사이드 힛갤"
      url: "https://gall.dcinside.com/board/lists/?id=hit"
    - label: "더쿠 핫게시판"
      url: "https://theqoo.net/hot"
    - label: "클리앙 모두의공원"
      url: "https://www.clien.net/service/board/park"
    - label: "뽐뿌 HOT게시판"
      url: "https://www.ppomppu.co.kr/hot.php"
  # 완전 자동 게시. true 면 스케줄러 수집분을 승인 없이 바로 게시(계정 연동 시). 기본 반자동.
  auto-publish: ${SOCIAL_AUTO_PUBLISH:false}
  instagram:
    access-token: ${IG_ACCESS_TOKEN:}  # 🔑 값 → application-secret.yml
    business-account-id: ${IG_BUSINESS_ACCOUNT_ID:}
    graph-api-url: ${IG_GRAPH_API_URL:https://graph.facebook.com/v21.0}
  # 카드 이미지 렌더(Node satori). node 미설치 시 렌더 실패해도 게시물은 DRAFT 로 남음(graceful).
  render:
    node-bin: ${SOCIAL_NODE_BIN:node}
    script-path: ${SOCIAL_RENDER_SCRIPT:render/render-card.mjs}
    timeout-ms: ${SOCIAL_RENDER_TIMEOUT_MS:90000}

# 자산관리(PM) 임대차 리마인더. 크론(Cloud Scheduler) → POST /api/ingest/lease-reminders
# (헤더 X-Ingest-Token, 마켓피드 수집 토큰 재사용). 만기/인상이 lead-days 이내로 다가오면 소유자에게 메일.
# SMTP(SPRING_MAIL_HOST 등) 미설정 시 graceful - 발송 대신 로그.
property:
  reminder-lead-days: ${PROPERTY_REMINDER_LEAD_DAYS:30}
  reminder-enabled: ${PROPERTY_REMINDER_ENABLED:true}

# Freemium: free AI-analysis credits granted at signup.
billing:
  free-signup-credits: ${FREE_SIGNUP_CREDITS:15}

# 크레딧 충전 결제(토스페이먼츠). 일회성 충전. 키는 전부 env/Secret Manager(절대 커밋 금지).
# clientKey 만 프론트 노출(공개), secretKey 는 서버 전용. 미설정 시 결제 비활성(graceful).
# 테스트키로 시작 → 사업자등록·PG 심사 후 라이브키로 교체. secret-key 없으면 /config 가 configured=false.
toss:
  client-key: ${TOSS_CLIENT_KEY:}
  secret-key: ${TOSS_SECRET_KEY:}  # 🔑 값 → application-secret.yml
  api-url: ${TOSS_API_URL:https://api.tosspayments.com}

# 간편 소셜 로그인(구글/카카오/네이버). 키는 전부 env/Secret Manager(신규 발급, 절대 커밋 금지).
# 미설정 제공자는 graceful - 해당 버튼이 프론트에서 자동 숨김. 카카오 secret(보안키)은 선택.
# 각 제공자 콘솔에 등록할 Redirect URI = {APP_BASE_URL}/api/auth/oauth/{google|kakao|naver}/callback
oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}  # 🔑 값 → application-secret.yml
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}  # 🔑 값 → application-secret.yml
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}  # 🔑 값 → application-secret.yml

# 실측 시장데이터 공공 API 키 (전부 신규 발급 + env - MASTERN 키 복사 금지).
# 미설정 시 해당 소스는 graceful degrade(건너뜀) → 분석은 AI 추정 흐름으로 계속.
#   ECOS_API_KEY        한국은행 ECOS (기준금리·국고채)        ecos.bok.or.kr
#   REB_RONE_API_KEY    한국부동산원 R-ONE (임대시장)          reb.or.kr
#   DATA_GO_KR_API_KEY  국토부 RTMS 실거래가                  data.go.kr
# 주소→시군구코드(5)는 내장 표(LawdCode). 공시지가/용도지역은 필지 PNU(19) 필요 →
# juso 지오코더(무료)로 법정동코드(10)+번지 획득 후 V-World 조회.
#   VWORLD_API_KEY  V-World 국토정보 (개별공시지가·용도지역)  api.vworld.kr
#   JUSO_API_KEY    도로명주소 검색 API (주소→법정동코드+번지)  business.juso.go.kr
marketdata:
  ecos-key: ${ECOS_API_KEY:}  # 🔑 값 → application-secret.yml
  reb-key: ${REB_RONE_API_KEY:}  # 🔑 값 → application-secret.yml
  data-go-kr-key: ${DATA_GO_KR_API_KEY:}  # 🔑 값 → application-secret.yml
  vworld-key: ${VWORLD_API_KEY:}  # 🔑 값 → application-secret.yml
  juso-key: ${JUSO_API_KEY:}  # 🔑 값 → application-secret.yml
  # V-World 키에 등록한 운영 도메인. 서버 호출은 Referer 가 없어 이 값을 domain 파라미터로 보내야
  # 인증을 통과한다(미설정 시 ned/data·일부 req/data 가 INCORRECT_KEY). 예: aixnative.com
  vworld-domain: ${VWORLD_DOMAIN:}
  # 개별공시지가(ned/data) 사용 여부. 키에 해당 NED API 활용신청 + vworld-domain 일치 시 true 로 켠다.
  vworld-ned-enabled: ${VWORLD_NED_ENABLED:false}

# 주거·입지 모듈(무료 입지 리포트 유입). 단지/실거래는 위 marketdata.data-go-kr-key 재사용
# (data.go.kr 에서 아파트 매매·공동주택 단지 API 활용신청 필요). 지오코딩·POI 는 카카오 REST 키.
residential:
  kakao-rest-key: ${KAKAO_REST_API_KEY:}  # 🔑 값 → application-secret.yml (로그인용 카카오 앱 REST 키 재사용 가능)
  kapt-enabled: ${RESIDENTIAL_KAPT_ENABLED:true}
  cheongyak-enabled: ${RESIDENTIAL_CHEONGYAK_ENABLED:true}

# 이 이메일로 가입하면 ADMIN 권한 부여 (어드민 전용 엔드포인트 접근).
app:
  admin-email: ${ADMIN_EMAIL:admin@aixnative.com}
  # SPA 허용 origin (CSV). 운영 도메인 = aixnative.com. 로컬 dev 는 Vite 프록시(same-origin)라 불필요하지만
  # 직접 호출/스테이징을 위해 localhost 도 기본 포함. 운영에선 ALLOWED_ORIGINS 로 좁히세요.
  allowed-origins: ${ALLOWED_ORIGINS:https://aixnative.com,https://www.aixnative.com,http://localhost:5173}
  # 이메일 인증 링크의 베이스 URL(운영=Cloud Run/도메인). 미설정 시 localhost(개발).
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # 인증 발신자 표기. 실제 발송은 SMTP(SPRING_MAIL_HOST 등) 설정 시에만 - 미설정이면 링크를 로그로 출력.
  # from = 발신 주소, from-name = 수신자 메일앱에 보이는 표시 이름(미설정 시 로컬파트 "admin" 노출 방지).
  mail:
    from: ${MAIL_FROM:admin@aixnative.com}
    from-name: AixNative  # 발신 표시 이름 - 고정값(env 미사용). 바꾸려면 이 값만 수정.
  verification:
    token-ttl-hours: ${VERIFICATION_TTL_HOURS:24}
  # 비밀번호 재설정 링크 만료(보안상 인증보다 짧게). 1회용.
  password-reset:
    token-ttl-hours: ${PASSWORD_RESET_TTL_HOURS:2}
  # 가입/재발송 IP당 시간 한도(무료 크레딧 어뷰징·봇 가입 방어). 너무 빡빡하지 않게 기본 5.
  signup-rate-limit:
    max-per-hour: ${SIGNUP_RATE_LIMIT_PER_HOUR:5}

# Cloud Run 등 컨테이너 플랫폼은 리슨 포트를 PORT 로 주입한다(기본 8080).
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
