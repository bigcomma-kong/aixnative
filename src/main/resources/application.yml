spring:
  application:
    name: aixnative

  # 임시: PostgreSQL 준비 전까지 기본 활성 프로필 = h2(파일 DB, 무설치 부팅).
  # Postgres 전환 시: SPRING_PROFILES_ACTIVE 를 빈 값(또는 postgres 프로필)으로 두고
  # DB_PASSWORD(+필요시 DB_URL/DB_USER) 환경변수를 주입하세요.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  # dev default = PostgreSQL. Override via env (DB_URL/DB_USER/DB_PASSWORD).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aixnative}
    username: ${DB_USER:aixnative}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (single source of truth). Hibernate never alters it.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Email (가입 인증/알림) — 신규 키 확보 후 연결. Phase 1 범위 밖. ---
  # mail:
  #   host: ${MAIL_HOST:}
  #   port: ${MAIL_PORT:587}
  #   username: ${MAIL_USERNAME:}
  #   password: ${MAIL_PASSWORD:}

  # --- 소셜 로그인 (구글/카카오) — 신규 client-id/secret 확보 후 연결. Phase 1 범위 밖. ---
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID:}
  #           client-secret: ${GOOGLE_CLIENT_SECRET:}
  #         kakao:
  #           client-id: ${KAKAO_CLIENT_ID:}
  #           client-secret: ${KAKAO_CLIENT_SECRET:}

# Stateless JWT signing. SECRET must be >= 32 bytes (HS256). Override in prod.
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-32bytes-minimum-secret-0123}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:120}

# AI router (priority + fallback). New keys only — never copy legacy values.
ai:
  service:
    auto-fallback: ${AI_AUTO_FALLBACK:true}
    provider-timeout-ms: ${AI_PROVIDER_TIMEOUT_MS:75000}
    overall-deadline-ms: ${AI_OVERALL_DEADLINE_MS:90000}

claude:
  api:
    key: ${CLAUDE_API_KEY:}
    url: ${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
    model: ${CLAUDE_API_MODEL:claude-opus-4-8}
    # 종합 분석(IC메모·시장조사 등)이 잘리지 않도록 8192. provider-timeout 75s 내 완주 가능.
    max-tokens: ${CLAUDE_MAX_TOKENS:8192}
  # 구독 OAuth 토큰(sk-ant-oat...). 설정 시 Bearer 인증 사용(x-api-key 대신).
  oauth:
    token: ${CLAUDE_OAUTH_TOKEN:}
  priority: ${CLAUDE_PRIORITY:0}

# 무료 AI(Mistral) — 신규 키만(env). 스케줄 배치 수집 보강(마켓 브리핑)에 직접 사용 → Claude 과금 격리.
# 미설정 시 브리핑은 자동 생략(딜 카드 수집은 그대로). priority 가 Claude(0)보다 높아 일반 라우터는 Claude 우선.
mistral:
  api:
    key: ${MISTRAL_API_KEY:}
    url: ${MISTRAL_API_URL:https://api.mistral.ai/v1/chat/completions}
    model: ${MISTRAL_API_MODEL:mistral-small-latest}
    max-tokens: ${MISTRAL_MAX_TOKENS:4096}
  priority: ${MISTRAL_PRIORITY:5}

# 시장 인텔리전스 자동 수집. 수집(RSS·구글뉴스)은 키 0개로 동작, 브리핑만 무료 Mistral 필요(graceful).
# 트리거: Cloud Scheduler → POST /api/ingest/market-feed (헤더 X-Ingest-Token). 토큰 미설정 시 인입 비활성.
marketfeed:
  ingest-token: ${MARKETFEED_INGEST_TOKEN:}
  recent-hours: ${MARKETFEED_RECENT_HOURS:48}
  max-per-source: ${MARKETFEED_MAX_PER_SOURCE:8}
  max-cards: ${MARKETFEED_MAX_CARDS:40}
  google-news-enabled: ${MARKETFEED_GOOGLE_NEWS:true}
  briefing-enabled: ${MARKETFEED_BRIEFING:true}

# Freemium: free AI-analysis credits granted at signup.
billing:
  free-signup-credits: ${FREE_SIGNUP_CREDITS:5}

# 실측 시장데이터 공공 API 키 (전부 신규 발급 + env — MASTERN 키 복사 금지).
# 미설정 시 해당 소스는 graceful degrade(건너뜀) → 분석은 AI 추정 흐름으로 계속.
#   ECOS_API_KEY        한국은행 ECOS (기준금리·국고채)        ecos.bok.or.kr
#   REB_RONE_API_KEY    한국부동산원 R-ONE (임대시장)          reb.or.kr
#   DATA_GO_KR_API_KEY  국토부 RTMS 실거래가                  data.go.kr
# 주소→시군구코드(5)는 내장 표(LawdCode). 공시지가/용도지역은 필지 PNU(19) 필요 →
# juso 지오코더(무료)로 법정동코드(10)+번지 획득 후 V-World 조회.
#   VWORLD_API_KEY  V-World 국토정보 (개별공시지가·용도지역)  api.vworld.kr
#   JUSO_API_KEY    도로명주소 검색 API (주소→법정동코드+번지)  business.juso.go.kr
marketdata:
  ecos-key: ${ECOS_API_KEY:}
  reb-key: ${REB_RONE_API_KEY:}
  data-go-kr-key: ${DATA_GO_KR_API_KEY:}
  vworld-key: ${VWORLD_API_KEY:}
  juso-key: ${JUSO_API_KEY:}
  # V-World 키에 등록한 운영 도메인. 서버 호출은 Referer 가 없어 이 값을 domain 파라미터로 보내야
  # 인증을 통과한다(미설정 시 ned/data·일부 req/data 가 INCORRECT_KEY). 예: aixnative.com
  vworld-domain: ${VWORLD_DOMAIN:}
  # 개별공시지가(ned/data) 사용 여부. 키에 해당 NED API 활용신청 + vworld-domain 일치 시 true 로 켠다.
  vworld-ned-enabled: ${VWORLD_NED_ENABLED:false}

# 이 이메일로 가입하면 ADMIN 권한 부여 (어드민 전용 엔드포인트 접근).
app:
  admin-email: ${ADMIN_EMAIL:admin@aixnative.com}
  # SPA 허용 origin (CSV). 운영 도메인 = aixnative.com. 로컬 dev 는 Vite 프록시(same-origin)라 불필요하지만
  # 직접 호출/스테이징을 위해 localhost 도 기본 포함. 운영에선 ALLOWED_ORIGINS 로 좁히세요.
  allowed-origins: ${ALLOWED_ORIGINS:https://aixnative.com,https://www.aixnative.com,http://localhost:5173}
  # 이메일 인증 링크의 베이스 URL(운영=Cloud Run/도메인). 미설정 시 localhost(개발).
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # 인증 발신자 표기. 실제 발송은 SMTP(SPRING_MAIL_HOST 등) 설정 시에만 — 미설정이면 링크를 로그로 출력.
  mail:
    from: ${MAIL_FROM:admin@aixnative.com}
  verification:
    token-ttl-hours: ${VERIFICATION_TTL_HOURS:24}
  # 비밀번호 재설정 링크 만료(보안상 인증보다 짧게). 1회용.
  password-reset:
    token-ttl-hours: ${PASSWORD_RESET_TTL_HOURS:2}
  # 가입/재발송 IP당 시간 한도(무료 크레딧 어뷰징·봇 가입 방어). 너무 빡빡하지 않게 기본 5.
  signup-rate-limit:
    max-per-hour: ${SIGNUP_RATE_LIMIT_PER_HOUR:5}

# Cloud Run 등 컨테이너 플랫폼은 리슨 포트를 PORT 로 주입한다(기본 8080).
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
