# Test profile — H2 in-memory (PostgreSQL compatibility mode).
# Lets the full build + tests run green with no live PostgreSQL and no API keys.
spring:
  datasource:
    url: jdbc:h2:mem:underwriteai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789ab
    access-ttl-minutes: 60

billing:
  free-signup-credits: 5
